<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER-TYPE: NETRUNNER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;700&family=Orbitron:wght@500;700;900&display=swap');

        :root {
            --bg-color: #050510;
            --neon-green: #0f0;
            --neon-pink: #f0f;
            --neon-blue: #0ff;
            --glass-bg: rgba(20, 20, 40, 0.6);
            --glass-border: rgba(0, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: #fff;
            font-family: 'Fira Code', monospace;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-image: 
                radial-gradient(circle at 50% 50%, #1a0b2e 0%, var(--bg-color) 100%),
                linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
            background-size: 100% 100%, 30px 30px, 30px 30px;
        }

        /* CRT Scanline Effect */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 10;
            pointer-events: none;
        }

        .hud-panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.1);
            text-transform: uppercase;
        }

        .hud-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8rem;
            color: var(--neon-blue);
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .hud-value {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        #game-area {
            position: relative;
            flex-grow: 1;
            width: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .word-entity {
            position: absolute;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--neon-pink);
            text-shadow: 0 0 10px var(--neon-pink);
            transition: color 0.2s;
            white-space: nowrap;
        }

        .word-entity .typed {
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
        }

        /* Screens */
        .screen {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(5, 5, 16, 0.85);
            backdrop-filter: blur(5px);
            z-index: 100;
            transition: opacity 0.3s;
        }

        .screen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .glitch-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 4rem;
            font-weight: 900;
            color: #fff;
            text-transform: uppercase;
            text-shadow: 
                2px 2px 0px var(--neon-blue),
                -2px -2px 0px var(--neon-pink);
            margin-bottom: 20px;
            letter-spacing: 4px;
            text-align: center;
        }

        .cyber-btn {
            background: transparent;
            color: var(--neon-blue);
            font-family: 'Fira Code', monospace;
            font-size: 1.2rem;
            padding: 15px 40px;
            border: 2px solid var(--neon-blue);
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            font-weight: bold;
            position: relative;
            overflow: hidden;
            transition: all 0.2s;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.2) inset;
        }

        .cyber-btn:hover {
            background: var(--neon-blue);
            color: #000;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.6);
        }

        #typing-input {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            border: 2px solid var(--neon-blue);
            color: var(--neon-green);
            font-family: 'Fira Code', monospace;
            font-size: 2rem;
            padding: 10px 30px;
            border-radius: 8px;
            text-align: center;
            width: 400px;
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
            z-index: 10;
        }

        #typing-input:focus {
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.5);
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--neon-green);
            box-shadow: 0 0 10px var(--neon-green);
            border-radius: 50%;
            pointer-events: none;
        }

        .danger-overlay {
            position: absolute;
            inset: 0;
            background: radial-gradient(circle, transparent 50%, rgba(255,0,0,0.2) 100%);
            opacity: 0;
            pointer-events: none;
            z-index: 5;
            transition: opacity 0.2s;
        }

        /* Locked target + danger zone */
        .word-entity.target {
            transform: scale(1.12);
            outline: 1px dashed var(--neon-blue);
            outline-offset: 6px;
            z-index: 3;
        }
        .word-entity.near {
            color: #ff3355;
            text-shadow: 0 0 14px #ff0033, 0 0 30px #ff0033;
            animation: pulse 0.5s ease-in-out infinite alternate;
        }
        @keyframes pulse { to { filter: brightness(1.6); } }

        .popup {
            position: absolute;
            font-family: 'Orbitron', sans-serif;
            font-weight: 900;
            font-size: 1.1rem;
            color: var(--neon-green);
            text-shadow: 0 0 10px var(--neon-green);
            pointer-events: none;
            white-space: nowrap;
            z-index: 4;
        }
        .popup.big { font-size: 1.6rem; color: #ff0; text-shadow: 0 0 14px #ff0; }

        .shake { animation: shake 0.3s; }
        @keyframes shake {
            0%,100% { transform: translate(0,0); }
            20% { transform: translate(-8px, 4px); }
            40% { transform: translate(7px, -5px); }
            60% { transform: translate(-5px, 3px); }
            80% { transform: translate(4px, -2px); }
        }

        #mute-btn {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 150;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            color: var(--neon-blue);
            font-size: 1.2rem;
            width: 46px;
            height: 46px;
            border-radius: 8px;
            cursor: pointer;
        }
        #mute-btn:hover { box-shadow: 0 0 20px rgba(0,255,255,0.4); }

        .best-line { color: #ff0; letter-spacing: 2px; margin-bottom: 30px; text-shadow: 0 0 10px rgba(255,255,0,0.5); }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, minmax(110px, 1fr));
            gap: 14px;
            margin: 20px 0 10px;
        }
        .stat-box { text-align: center; }
        .stat-box .hud-value { font-size: 1.8rem; color: var(--neon-green); }
        .new-best {
            font-family: 'Orbitron', sans-serif;
            color: #ff0;
            font-weight: 900;
            letter-spacing: 3px;
            margin-top: 10px;
            animation: pulse 0.4s infinite alternate;
        }
        @media (max-width: 600px) {
            .glitch-title { font-size: 2.4rem; }
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            #typing-input { width: 85vw; font-size: 1.5rem; }
            .hud-panel { padding: 8px 12px; }
            .hud-value { font-size: 1.1rem; }
            #mute-btn { top: auto; bottom: 110px; }
        }
    </style>
</head>
<body>

    <div id="hud">
        <div class="hud-panel">
            <div class="hud-title">SCORE</div>
            <div class="hud-value" id="score">0</div>
        </div>
        <div class="hud-panel">
            <div class="hud-title">MULTIPLIER</div>
            <div class="hud-value" id="multiplier">x1</div>
        </div>
        <div class="hud-panel" style="border-color: rgba(255,0,255,0.4);">
            <div class="hud-title" style="color: var(--neon-pink);">SYSTEM INTEGRITY</div>
            <div class="hud-value" id="lives">100%</div>
        </div>
    </div>

    <div class="danger-overlay" id="danger"></div>
    <div id="game-area"></div>
    
    <input type="text" id="typing-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus disabled>

    <button id="mute-btn" aria-label="Toggle sound">🔊</button>

    <!-- Start Screen -->
    <div class="screen" id="start-screen">
        <h1 class="glitch-title">NETRUNNER</h1>
        <p style="margin-bottom: 14px; color: var(--neon-blue); letter-spacing: 2px;">Intercept the incoming data packets.</p>
        <div class="best-line" id="start-best">HIGH SCORE: 0</div>
        <button class="cyber-btn" id="start-btn">INITIALIZE CONNECTION</button>
    </div>

    <!-- Game Over Screen -->
    <div class="screen hidden" id="game-over-screen">
        <div class="glitch-title" style="color: var(--neon-pink); text-shadow: 2px 2px 0px #f00, -2px -2px 0px var(--neon-pink);">SYSTEM BREACHED</div>
        <div style="font-size: 1.5rem;">FINAL SCORE: <span id="final-score" style="color: var(--neon-green);">0</span></div>
        <div class="new-best" id="new-best" style="display:none;">★ NEW HIGH SCORE ★</div>
        <div class="stats-grid">
            <div class="hud-panel stat-box"><div class="hud-title">WPM</div><div class="hud-value" id="stat-wpm">0</div></div>
            <div class="hud-panel stat-box"><div class="hud-title">ACCURACY</div><div class="hud-value" id="stat-acc">0%</div></div>
            <div class="hud-panel stat-box"><div class="hud-title">BEST COMBO</div><div class="hud-value" id="stat-combo">0</div></div>
            <div class="hud-panel stat-box"><div class="hud-title">HIGH SCORE</div><div class="hud-value" id="stat-best">0</div></div>
        </div>
        <button class="cyber-btn" id="restart-btn" style="margin-top: 20px;">REBOOT SYSTEM</button>
    </div>

    <script>
        const wordList = [
            "algorithm", "bandwidth", "cyberpunk", "database", "encryption", 
            "firewall", "gateway", "hologram", "interface", "javascript", 
            "kernel", "latency", "mainframe", "network", "override", 
            "protocol", "quantum", "router", "syntax", "terminal", 
            "uplink", "variable", "webhook", "xml", "yottabyte", "zero-day",
            "proxy", "node", "socket", "packet", "malware", "trojan", "botnet",
            "cipher", "decrypt", "backdoor", "hash", "phishing", "exploit",
            "payload", "spoofing", "vulnerability", "patch", "logic", "binary"
        ];

        let words = [];
        let score = 0;
        let lives = 100;
        let combo = 0;
        let gameLoop;
        let spawnInterval;
        let difficulty = 1;
        let isPlaying = false;
        let lastTime = 0;

        // Stats
        let startTime = 0;
        let correctKeys = 0;
        let totalKeys = 0;
        let charsCleared = 0;
        let bestCombo = 0;
        let prevLen = 0;
        let target = null; // the single word currently locked on
        const BEST_KEY = 'cybertype_best';
        let highScore = parseInt(localStorage.getItem(BEST_KEY) || '0', 10);
        document.getElementById('start-best').textContent = 'HIGH SCORE: ' + highScore;

        // ── SOUND (WebAudio synth, no files needed) ──
        let muted = localStorage.getItem('cybertype_muted') === '1';
        let actx = null;
        const muteBtn = document.getElementById('mute-btn');
        muteBtn.textContent = muted ? '🔇' : '🔊';
        muteBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            muted = !muted;
            localStorage.setItem('cybertype_muted', muted ? '1' : '0');
            muteBtn.textContent = muted ? '🔇' : '🔊';
            if (isPlaying) inputField.focus();
        });
        function tone(freq, dur, type = 'square', vol = 0.05, slideTo = null, delay = 0) {
            if (muted) return;
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            const t = actx.currentTime + delay;
            const o = actx.createOscillator();
            const g = actx.createGain();
            o.type = type;
            o.frequency.setValueAtTime(freq, t);
            if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
            g.gain.setValueAtTime(vol, t);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g).connect(actx.destination);
            o.start(t);
            o.stop(t + dur);
        }
        const sfx = {
            key: () => tone(900 + Math.random() * 200, 0.04, 'square', 0.025),
            miss: () => tone(140, 0.12, 'sawtooth', 0.05),
            boom: (m) => { tone(220 * Math.min(m, 4), 0.25, 'triangle', 0.08, 880 * Math.min(m, 4)); tone(80, 0.2, 'sawtooth', 0.05, 30); },
            damage: () => { tone(300, 0.35, 'sawtooth', 0.09, 60); },
            levelUp: () => [523, 659, 784].forEach((f, i) => tone(f, 0.12, 'square', 0.05, null, i * 0.08)),
            over: () => [440, 330, 220, 110].forEach((f, i) => tone(f, 0.3, 'sawtooth', 0.07, null, i * 0.18))
        };

        const gameArea = document.getElementById('game-area');
        const inputField = document.getElementById('typing-input');
        const scoreEl = document.getElementById('score');
        const livesEl = document.getElementById('lives');
        const multiplierEl = document.getElementById('multiplier');
        const dangerEl = document.getElementById('danger');
        
        const startScreen = document.getElementById('start-screen');
        const gameOverScreen = document.getElementById('game-over-screen');

        class WordEntity {
            constructor(text, speed) {
                this.text = text;
                this.originalText = text;
                this.typed = "";
                this.speed = speed;
                
                this.el = document.createElement('div');
                this.el.className = 'word-entity';
                this.updateHTML();
                
                this.y = -50;
                this.el.style.top = this.y + 'px';
                gameArea.appendChild(this.el);

                // Spawn randomly on the x-axis, fully on-screen (measured after render)
                const w = this.el.offsetWidth;
                this.x = 20 + Math.random() * Math.max(0, window.innerWidth - w - 40);
                this.el.style.left = this.x + 'px';
            }

            updateHTML() {
                this.el.innerHTML = `<span class="typed">${this.typed}</span>${this.text.substring(this.typed.length)}`;
            }

            move(dt) {
                this.y += this.speed * dt;
                this.el.style.top = this.y + 'px';
                this.el.classList.toggle('near', this.y > window.innerHeight * 0.7);
                return this.y > window.innerHeight;
            }
            
            destroy() {
                createParticles(this.x + this.el.offsetWidth/2, this.y + this.el.offsetHeight/2);
                this.el.remove();
            }
        }

        function spawnWord() {
            if (!isPlaying) return;
            const randomWord = wordList[Math.floor(Math.random() * wordList.length)];
            const speed = 0.05 * difficulty + Math.random() * 0.05;
            words.push(new WordEntity(randomWord, speed));
            
            // Increase difficulty slowly
            difficulty += 0.05;
            clearTimeout(spawnInterval);
            spawnInterval = setTimeout(spawnWord, Math.max(800, 2000 - difficulty * 100));
        }

        function update(time) {
            if (!isPlaying) return;
            const dt = time - lastTime;
            lastTime = time;

            for (let i = words.length - 1; i >= 0; i--) {
                const w = words[i];
                if (w.move(dt)) {
                    // Missed word
                    w.el.remove();
                    words.splice(i, 1);
                    if (w === target) target = null;
                    takeDamage(10);
                    resetCombo();
                    if (!isPlaying) return;
                }
            }

            gameLoop = requestAnimationFrame(update);
        }

        function shake() {
            document.body.classList.remove('shake');
            void document.body.offsetWidth;
            document.body.classList.add('shake');
        }

        function popup(x, y, text, big = false) {
            const p = document.createElement('div');
            p.className = 'popup' + (big ? ' big' : '');
            p.textContent = text;
            p.style.left = x + 'px';
            p.style.top = y + 'px';
            gameArea.appendChild(p);
            p.animate([
                { transform: 'translate(-50%, 0) scale(0.6)', opacity: 0 },
                { transform: 'translate(-50%, -20px) scale(1.15)', opacity: 1, offset: 0.25 },
                { transform: 'translate(-50%, -70px) scale(1)', opacity: 0 }
            ], { duration: 900, easing: 'ease-out' }).onfinish = () => p.remove();
        }

        function takeDamage(amt) {
            lives = Math.max(0, lives - amt);
            livesEl.textContent = lives + '%';
            sfx.damage();
            shake();
            
            // Screen flash red
            dangerEl.style.opacity = '1';
            setTimeout(() => { dangerEl.style.opacity = '0'; }, 200);

            if (lives <= 0) {
                endGame();
            } else if (lives <= 30) {
                livesEl.style.color = '#f00';
            }
        }

        function addScore(w) {
            combo++; // count first so the multiplier shown matches the points awarded
            bestCombo = Math.max(bestCombo, combo);
            const multi = Math.floor(combo / 5) + 1;
            const prevMulti = Math.floor((combo - 1) / 5) + 1;
            multiplierEl.textContent = 'x' + multi;
            const pts = w.text.length * 10 * multi;
            score += pts;
            scoreEl.textContent = score;
            charsCleared += w.text.length;

            const cx = w.x + w.el.offsetWidth / 2, cy = w.y;
            popup(cx, cy, `+${pts}` + (multi > 1 ? ` x${multi}` : ''));
            sfx.boom(multi);
            if (multi > prevMulti) {
                popup(window.innerWidth / 2, window.innerHeight * 0.4, `COMBO x${multi}!`, true);
                sfx.levelUp();
            }
        }

        function resetCombo() {
            combo = 0;
            multiplierEl.textContent = 'x1';
            inputField.value = ''; // clear input on miss
            prevLen = 0;
            words.forEach(w => { w.typed = ''; w.updateHTML(); w.el.classList.remove('target'); });
            target = null;
            inputField.style.borderColor = '#f00';
            setTimeout(() => { inputField.style.borderColor = 'var(--neon-blue)'; }, 300);
        }

        function createParticles(x, y) {
            for (let i = 0; i < 15; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = x + 'px';
                p.style.top = y + 'px';
                
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 100 + 50;
                const tx = Math.cos(angle) * speed;
                const ty = Math.sin(angle) * speed;
                
                gameArea.appendChild(p);
                
                p.animate([
                    { transform: 'translate(0,0) scale(1)', opacity: 1 },
                    { transform: `translate(${tx}px, ${ty}px) scale(0)`, opacity: 0 }
                ], { duration: 600, easing: 'cubic-bezier(0,.9,.57,1)' }).onfinish = () => p.remove();
            }
        }

        inputField.addEventListener('input', (e) => {
            if (!isPlaying) return;
            const val = e.target.value.toLowerCase().trim();
            const grew = val.length > prevLen;
            prevLen = val.length;

            // Lock onto ONE word: keep the current target if it still matches,
            // otherwise pick the matching word closest to the bottom (most dangerous).
            if (!val) {
                target = null;
            } else if (!target || !target.text.startsWith(val)) {
                target = null;
                for (const w of words) {
                    if (w.text.startsWith(val) && (!target || w.y > target.y)) target = w;
                }
            }

            words.forEach(w => {
                const isT = w === target;
                w.typed = isT ? val : '';
                w.updateHTML();
                w.el.classList.toggle('target', isT);
            });

            if (grew) {
                totalKeys++;
                if (target) { correctKeys++; sfx.key(); }
            }

            if (target && val === target.text) {
                // Word successfully typed
                const w = target;
                addScore(w);
                w.destroy();
                words.splice(words.indexOf(w), 1);
                target = null;
                inputField.value = ''; // Reset input
                prevLen = 0;
            } else if (!target && val.length > 0 && grew) {
                // Typo
                sfx.miss();
                inputField.style.backgroundColor = 'rgba(255,0,0,0.2)';
                setTimeout(() => { inputField.style.backgroundColor = 'var(--glass-bg)'; }, 150);
            }
        });

        function startGame() {
            startScreen.classList.add('hidden');
            gameOverScreen.classList.add('hidden');
            
            // Reset state
            words.forEach(w => w.el.remove());
            words = [];
            score = 0;
            lives = 100;
            combo = 0;
            difficulty = 1;
            correctKeys = totalKeys = charsCleared = bestCombo = prevLen = 0;
            target = null;
            startTime = performance.now();
            
            scoreEl.textContent = '0';
            livesEl.textContent = '100%';
            livesEl.style.color = 'inherit';
            multiplierEl.textContent = 'x1';
            
            inputField.disabled = false;
            inputField.value = '';
            inputField.focus();
            
            isPlaying = true;
            lastTime = performance.now();
            
            clearTimeout(spawnInterval);
            spawnInterval = setTimeout(spawnWord, 1200);
            gameLoop = requestAnimationFrame(update);
        }

        function endGame() {
            if (!isPlaying) return;
            isPlaying = false;
            clearTimeout(spawnInterval);
            cancelAnimationFrame(gameLoop);
            sfx.over();
            
            inputField.disabled = true;
            inputField.blur();

            const minutes = Math.max((performance.now() - startTime) / 60000, 1 / 60);
            const wpm = Math.round((charsCleared / 5) / minutes);
            const acc = totalKeys ? Math.round((correctKeys / totalKeys) * 100) : 0;
            const isNewBest = score > highScore;
            if (isNewBest) {
                highScore = score;
                localStorage.setItem(BEST_KEY, String(highScore));
            }

            document.getElementById('final-score').textContent = score;
            document.getElementById('stat-wpm').textContent = wpm;
            document.getElementById('stat-acc').textContent = acc + '%';
            document.getElementById('stat-combo').textContent = bestCombo;
            document.getElementById('stat-best').textContent = highScore;
            document.getElementById('new-best').style.display = isNewBest && score > 0 ? 'block' : 'none';
            document.getElementById('start-best').textContent = 'HIGH SCORE: ' + highScore;
            gameOverScreen.classList.remove('hidden');
        }

        document.getElementById('start-btn').addEventListener('click', startGame);
        document.getElementById('restart-btn').addEventListener('click', startGame);
        
        // Keep focus on input
        document.addEventListener('click', () => {
            if (isPlaying) inputField.focus();
        });

    </script>
</body>
